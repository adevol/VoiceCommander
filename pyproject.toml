[project]
name = "voicecommander"
version = "0.1.0"
description = "Hotkey-driven local or cloud speech transcription for Windows"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28,<1",
    "keyboard>=0.13.5",
    "keyring>=25.6",
    "openrouter>=1,<2",
    "pyperclip>=1.9",
    "pyyaml>=6.0",
    "soundcard>=0.4.4",
    "sounddevice>=0.5",
]

[project.scripts]
voicecommander = "voicecommander.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
build = [
    "pyinstaller>=6.21",
]
dev = [
    "ruff>=0.16.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voicecommander"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
