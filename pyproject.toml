[project]
name = "voicecommander"
version = "0.1.0"
description = "Hotkey-driven local or cloud speech transcription for Windows"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "keyboard>=0.13.5",
    "keyring>=25.6",
    "onnx-asr[hub]>=0.12,<0.13",
    "onnxruntime-directml>=1.24.2,<1.25",
    "pyperclip>=1.9",
    "soundcard>=0.4.4",
    "sounddevice>=0.5",
    "transcribe-cpp>=0.2,<0.3",
]

[project.scripts]
voicecommander = "voicecommander.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
build = [
    "pyinstaller>=6.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voicecommander"]
